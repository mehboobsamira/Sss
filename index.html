<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Jaan</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff0077;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pine Tree Animation */
        .tree {
            position: relative;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 150px solid var(--neon-blue);
            filter: drop-shadow(0 0 20px var(--neon-blue));
            opacity: 0;
            transform: scale(0);
            animation: growTree 6s ease-in-out forwards;
        }

        .tree::before {
            content: '';
            position: absolute;
            top: 60px;
            left: -120px;
            border-left: 120px solid transparent;
            border-right: 120px solid transparent;
            border-bottom: 180px solid var(--neon-blue);
        }

        .tree::after {
            content: '⭐';
            position: absolute;
            top: -30px;
            left: -15px;
            font-size: 30px;
            filter: drop-shadow(0 0 10px yellow);
        }

        /* Hearts blooming on tree */
        .heart {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: bloom 2s ease-in forwards;
        }

        @keyframes growTree {
            0% { opacity: 0; transform: scale(0) translateY(100px); }
            50% { opacity: 1; transform: scale(1.1) translateY(0); }
            100% { opacity: 0; transform: scale(1.5); filter: blur(20px); }
        }

        @keyframes bloom {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Final Text */
        .message {
            position: absolute;
            white-space: nowrap;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-pink);
            opacity: 0;
            animation: showText 2s ease-in forwards;
            animation-delay: 6.5s;
        }

        @keyframes showText {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Background Sparkles */
        .sparkle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tree">
            <span class="heart" style="top: 40px; left: -20px; animation-delay: 2s;">💕</span>
            <span class="heart" style="top: 80px; left: 30px; animation-delay: 3s;">🤌</span>
            <span class="heart" style="top: 100px; left: -50px; animation-delay: 4s;">💕</span>
            <span class="heart" style="top: 130px; left: 10px; animation-delay: 5s;">💗</span>
        </div>
        
        <div class="message">I Love You Jaan 💕🤌</div>
    </div>

    <script>
        // Background mein sitare banane ke liye
        for (let i = 0; i < 50; i++) {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(sparkle);
        }
    </script>
</body>
</html>
